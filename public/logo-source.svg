<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur" x="8" y="8" width="240" height="240" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="petal" x1="128" y1="40" x2="128" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.96"/>
      <stop offset="1" stop-color="white" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 128) rotate(90) scale(44)">
      <stop stop-color="white" stop-opacity="0.95"/>
      <stop offset="1" stop-color="white" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
  <g filter="url(#blur)">
    <circle cx="128" cy="128" r="72" fill="white" fill-opacity="0.08"/>
  </g>
  <g opacity="0.94">
    <ellipse cx="128" cy="78" rx="28" ry="50" fill="url(#petal)"/>
    <ellipse cx="128" cy="78" rx="28" ry="50" transform="rotate(60 128 128)" fill="url(#petal)"/>
    <ellipse cx="128" cy="78" rx="28" ry="50" transform="rotate(120 128 128)" fill="url(#petal)"/>
    <ellipse cx="128" cy="78" rx="28" ry="50" transform="rotate(180 128 128)" fill="url(#petal)"/>
    <ellipse cx="128" cy="78" rx="28" ry="50" transform="rotate(240 128 128)" fill="url(#petal)"/>
    <ellipse cx="128" cy="78" rx="28" ry="50" transform="rotate(300 128 128)" fill="url(#petal)"/>
  </g>
  <circle cx="128" cy="128" r="38" fill="url(#core)"/>
  <circle cx="128" cy="128" r="22" fill="white" fill-opacity="0.82"/>
</svg>
